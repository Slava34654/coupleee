# Fly.io — основной вариант (бесплатный лимит, постоянный диск, HTTPS)
app = "couplejoy-app"
primary_region = "fra"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[mounts]]
  source = "couple_data"
  destination = "/data"

[env]
  COUPLE_DB = "/data/couple.db"
  PHOTO_DIR = "/data/photos"
